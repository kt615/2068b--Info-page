<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team 2068B Robotics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --blue: #007bff;
      --yellow: #ffd700;
      --light: #ffffff;
      --dark: #0b0c10;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000000;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated sunset sky with real clouds */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("https://i.imgur.com/4YVQe5B.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: driftClouds 60s linear infinite;
      opacity: 0.9;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at top,
        rgba(255, 200, 150, 0.6),
        rgba(255, 140, 180, 0.4),
        rgba(255, 215, 0, 0.25),
        rgba(11, 12, 16, 0.6)
      );
      animation: sunsetGlow 40s ease-in-out infinite alternate;
      mix-blend-mode: soft-light;
    }

    @keyframes driftClouds {
      0% { background-position: center; }
      50% { background-position: center 20px; }
      100% { background-position: center; }
    }

    @keyframes sunsetGlow {
      0% { opacity: 0.6; }
      50% { opacity: 0.9; }
      100% { opacity: 0.6; }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 12, 16, 0.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      color: var(--light);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .logo span {
      color: var(--blue);
    }

    nav a {
      color: var(--light);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    nav a:hover {
      color: var(--yellow);
    }

    .hero {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 2.5rem 1.5rem;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);
      gap: 2rem;
      align-items: center;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    .hero h1 {
      font-size: 2.6rem;
      margin-bottom: 0.75rem;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero p {
      margin-bottom: 1.5rem;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid var(--blue);
      color: var(--light);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(0, 0, 0, 0.35);
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
    }
