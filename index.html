<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team 2068B Robotics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* GLOBAL RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY + ANIMATED SUNSET CLOUD BACKGROUND */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* REAL SUNSET CLOUD IMAGE + SLOW MOVEMENT */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("https://images.unsplash.com/photo-1501973801540-537f08ccae7b?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  animation: drift 60s ease-in-out infinite;
  z-index: -2;
  opacity: 0.9;
}

/* SUNSET GLOW GRADIENT OVERLAY */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top,
    rgba(255,180,120,0.5),
    rgba(255,120,160,0.4),
    rgba(255,200,0,0.25),
    rgba(0,0,0,0.6)
  );
  animation: glow 40s ease-in-out infinite alternate;
  z-index: -1;
  mix-blend-mode: soft-light;
}

@keyframes drift {
  0% { background-position: center; }
  50% { background-position: center 20px; }
  100% { background-position: center; }
}

@keyframes glow {
  0% { opacity: 0.6; }
  50% { opacity: 0.9; }
  100% { opacity: 0.6; }
}

/* NAVBAR */
header {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  padding: 1rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: #ffd700;
  text-decoration: none;
  margin-left: 1rem;
  font-weight: 600;
}
