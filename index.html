<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team 2068 B Robotics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --blue: #007bff;
      --gray: #2e2e2e;
      --yellow: #ffd700;
      --light: #ffffff;
      --bg: #0b0c10;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2833, #0b0c10);
      color: var(--light);
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 12, 16, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .logo span {
      color: var(--blue);
    }

    nav a {
      color: var(--light);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    nav a:hover {
      color: var(--yellow);
    }

    .hero {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 2.5rem 1.5rem;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);
      gap: 2rem;
      align-items: center;
    }

    .hero h1 {
      font-size: 2.6rem;
      margin-bottom: 0.75rem;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero p {
      color: #c5c6c7;
      margin-bottom: 1.5rem;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid var(--blue);
      color: var(--light);
      text-decoration: none;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    .btn-outline:hover {
      background: rgba(0, 123, 255, 0.15);
    }

    .hero-card {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.5rem;
      background: linear-gradient(145deg, rgba(0, 123, 255, 0.15), rgba(255, 215, 0, 0.08));
    }

    .hero-card h2 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .hero-card ul {
      list-style: none;
    }

    .hero-card li {
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .hero-card li::before {
      content: "• ";
      color: var(--yellow);
    }

    section {
      max-width: 1100px;
      margin: 0 auto 2.5rem auto;
      padding: 0 1.5rem;
    }

    section h2 {
      font-size: 1.8rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--yellow);
    }

    section p {
      color: #c5c6c7;
      margin-bottom: 1rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card ul {
      list-style: none;
      color: #c5c6c7;
      font-size: 0.95rem;
    }

    .card li {
      margin-bottom: 0.35rem;
    }

    .card li::before {
      content: "› ";
      color: var(--yellow);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #c5c6c7;
    }

    .awards-list li::before {
      content: "🏆 ";
      color: var(--yellow);
    }

    .sponsor-logo {
      height: 40px;
      width: 140px;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #c5c6c7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      height: 140px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle at top, rgba(0, 123, 255, 0.35), rgba(11, 12, 16, 1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #c5c6c7;
      text-align: center;
      padding: 0.75rem;
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.5rem;
      text-align: center;
      color: #c5c6c7;
      font-size: 0.85rem;
      background: rgba(11, 12, 16, 0.95);
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero h1 {
        font-size: 2.1rem;
      }
      nav a {
        font-size: 0.8rem;
        margin-left: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="nav">
      <div class="logo">Team <span>2068 B</span></div>
      <nav>
        <a href="#about">About</a>
        <a href="#team">Team</a>
        <a href="#robots">Robots</a>
