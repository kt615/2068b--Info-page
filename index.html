* {

/* BODY */
body {

  overflow-x: hidden;

/* BLUE SKY BACKGROUND */
body::before {

  inset: 0;
  background: linear-gradient(#6ec6ff, #bde6ff);
  z-index: -3;
}

.clouds {

  animation: cloudMove 120s linear infinite;
  opacity: 0.8;
  z-index: -2;
}

  opacity: 0.5;
  z-index: -1;
}
