<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team 2068B Robotics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BACKGROUND IMAGE + BLUE TINT */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  color: #fff;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("https://thumbs.dreamstime.com/b/rainy-city-night-view-wet-window-blurry-lights-shine-rain-covered-creating-moody-atmosphere-perfect-desktop-358885491.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: brightness(0.8) saturate(1.2);
  z-index: -3;
}

/* BLUE OVERLAY FOR TINT */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 60, 120, 0.35);
  backdrop-filter: blur(2px);
  z-index: -2;
}

/* NAVBAR */
header {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 1rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: #ffd700;
  text-decoration: none;
  margin-left: 1rem;
  font-weight: 600;
}

/* HERO */
.hero {
  max-width: 1100px;
  margin: 3rem auto;
  padding: 2rem;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

/* LOGO IMAGE */
.hero img {
  width: 220px;
  height: auto;
  margin-bottom: 1rem;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
}

.hero h1 {
  font-size: 2.8rem;
  margin-bottom: 1rem;
}

.hero p {
  font-size: 1.2rem;
}

/* SECTIONS */
section {
  max-width: 1100px;
  margin: 2rem auto;
  padding: 1rem;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

section h2 {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: #ffd700;
}

/* SPONSORSHIP PACKET */
.sponsor-wrapper {
  display: flex;
  justify-content: center;
  margin-top: 1rem;
}

.sponsor-card {
  width: 100%;
  max-width: 700px;
  background: rgba(0,0,0,0.55);
  padding: 1.5rem;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.sponsor-card h3 {
  margin-top: 1rem;
  color: #00aaff;
}

.sponsor-card ul {
  list-style: none;
  margin: 0.5rem 0 1rem 0;
}

.sponsor-card ul li {
  margin-bottom: 0.4rem;
}

.sponsor-card ul li::before {
  content: "• ";
  color: #ffd700;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 1rem;
  background: rgba(0,0,0,0.6);
  margin-top: 2rem;
  color: #fff;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
  <nav>
